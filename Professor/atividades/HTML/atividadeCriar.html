<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstudeX – Criar Questão</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="../CSS/atividadeCriar.css">
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <i class="fas fa-bars menu-icon" id="menu-toggle"></i>
      <span class="logo-text">EstudeX <span class="professor-badge">Prof</span></span>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li>
          <a href="../../../Professor/perfil/HTML/professorPerfil.html" class="nav-item">
            <i class="fas fa-user"></i><span>Perfil</span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-item active">
            <i class="fas fa-tasks"></i><span>Atividades</span>
          </a>
        </li>
        <li>
          <a href="../../../Professor/turma/HTML/professorTurma.html" class="nav-item">
            <i class="fas fa-users"></i><span>Turmas</span>
          </a>
        </li>
        <li>
          <a href="#" class="nav-item">
            <i class="fas fa-question-circle"></i><span>Dúvidas</span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="sidebar-footer">
      <a href="#" class="nav-item" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i><span>Sair</span>
      </a>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="dashboard-content">

    <!-- BANNER -->
    <div class="page-banner">
      <div class="banner-icon">
        <i class="fas fa-plus-circle"></i>
      </div>
      <div class="banner-text">
        <h1>Criar Nova Questão</h1>
        <p>Preencha o enunciado e adicione as alternativas da questão</p>
      </div>
    </div>

    <!-- PROGRESSO -->
    <div class="progress-section">
      <span class="progress-label" id="questao-numero">Questão 1</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="questao-progress" style="width:5%"></div>
      </div>
    </div>

    <!-- CARD: TÍTULO -->
    <div class="card">
      <div class="card-section-title">
        <i class="fas fa-info-circle"></i>
        Título da Atividade
      </div>
      <div class="form-group">
        <label class="field-label">Título <span class="required">*</span></label>
        <input type="text" id="titulo" class="input-field" placeholder="Digite o título da atividade...">
      </div>
    </div>

    <!-- CARD: QUESTÃO -->
    <div class="card">
      <div class="card-section-title">
        <i class="fas fa-circle-question"></i>
        Enunciado da Questão
      </div>

      <div class="form-group">
        <label class="field-label">
          <i class="fas fa-file-lines"></i>
          Enunciado <span class="required">*</span>
        </label>
        <textarea class="input-field input-enunciado" id="enunciado" placeholder="Digite o enunciado da questão..."></textarea>
      </div>

      <div class="divider"></div>

      <div class="opcoes-header">
        <div class="card-section-title" style="margin-bottom:0">
          <i class="fas fa-list-check"></i>
          Alternativas
        </div>
        <span class="opcoes-count" id="count-label">1 / 5</span>
      </div>

      <p class="opcoes-hint">
        <i class="fas fa-circle-info"></i>
        Selecione o círculo ao lado da alternativa correta
      </p>

      <div id="opcoes-container"></div>

      <button class="btn-add" id="btn-add-opcao" onclick="adicionarOpcao()">
        <i class="fas fa-plus"></i>
        Adicionar alternativa
      </button>

      <div class="card-footer">
        <div class="footer-left">
          <button class="btn btn-secondary" onclick="cancelar()">
            <i class="fas fa-xmark"></i> Cancelar
          </button>
          <button class="btn btn-secondary" id="btn-anterior" onclick="questaoAnterior()" disabled>
            <i class="fas fa-arrow-left"></i> Anterior
          </button>
        </div>
        <div class="footer-right">
          <button class="btn btn-outline" onclick="finalizarAtividade()">
            <i class="fas fa-flag-checkered"></i> Finalizar Atividade
          </button>
          <button class="btn btn-primary" id="btn-proxima" onclick="proximaQuestao()">
            <i class="fas fa-save"></i> Próxima Questão
          </button>
        </div>
      </div>
    </div>

  </main>

  <!-- TOAST -->
  <div class="toast" id="toast">
    <i class="fas fa-circle-check" id="toast-icon"></i>
    <span id="toast-msg">Questão salva!</span>
  </div>

  <script src="../JS/atividadeCriar.js"></script>
  <script src="../JS/menuSideBar.js"></script>
</body>
</html>
