<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstudeX – Criar Atividade</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="../CSS/atividadeCriar.css">
  <link rel="stylesheet" href="../../perfil/CSS/professorSidebar.css">
</head>

<body>

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="sidebar-header">
      <i class="fas fa-bars menu-icon" id="menu-toggle"></i>

      <span class="logo-text">
        EstudeX
        <span class="professor-badge">Prof</span>
      </span>
    </div>

    <nav class="sidebar-nav">
      <ul>

        <li>
          <a href="../../../Professor/perfil/HTML/professorPerfil.html" class="nav-item">
            <i class="fas fa-user"></i>
            <span>Perfil</span>
          </a>
        </li>

        <li>
          <a href="#" class="nav-item active">
            <i class="fas fa-tasks"></i>
            <span>Atividades</span>
          </a>
        </li>

        <li>
          <a href="../../../Professor/turma/HTML/professorTurma.html" class="nav-item">
            <i class="fas fa-users"></i>
            <span>Turmas</span>
          </a>
        </li>

        <li>
          <a href="../HTML/duvidas.html" class="nav-item">
            <i class="fas fa-question-circle"></i>
            <span>Dúvidas</span>
          </a>
        </li>

      </ul>
    </nav>

    <div class="sidebar-footer">
      <a href="../../../Login/HTML/login.html" class="nav-item" id="logoutBtn">
        <i class="fas fa-sign-out-alt"></i>
        <span>Sair</span>
      </a>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="dashboard-content">

    <!-- HEADER -->
    <div class="header-top">

      <div class="page-title">
        <i class="fas fa-file-circle-plus"></i>
        <h1>Criar Nova Atividade</h1>
      </div>

      <div class="notifications-icon">
        <i class="fas fa-bell"></i>
        <span class="notification-badge">3</span>
      </div>

    </div>

    <!-- CARD PRINCIPAL -->
    <div class="card main-form-card">

      <div class="card-section-title">
        <i class="fas fa-clipboard-list"></i>
        Detalhes da Atividade
      </div>

      <!-- INFORMAÇÕES BÁSICAS -->
      <div class="form-section">

        <h2>Informações Básicas</h2>

        <div class="form-group">
          <label class="field-label" for="titulo">
            Título da Atividade
            <span class="required">*</span>
          </label>

          <input type="text" id="titulo" class="input-field" placeholder="Ex: Revisão de Cálculo I">
        </div>


      </div>

      <div class="divider"></div>

      <!-- QUESTÕES -->
      <div class="form-section">

        <h2>Questões da Atividade</h2>

        <!-- PROGRESSO -->
        <div class="progress-section">

          <span class="progress-label" id="questao-numero">
            Questão 1
          </span>

          <!-- CORREÇÃO AQUI -->
          <div class="progress-bar-bg">

            <div class="progress-bar-fill" id="questao-progress" style="width:5%">
            </div>

          </div>

        </div>

        <!-- ENUNCIADO -->
        <div class="form-group">

          <label class="field-label" for="enunciado">
            Enunciado da Questão
            <span class="required">*</span>
          </label>

          <textarea class="input-field input-enunciado" id="enunciado"
            placeholder="Digite o enunciado da questão..."></textarea>

        </div>

        <!-- CABEÇALHO DAS ALTERNATIVAS -->
        <div class="opcoes-header">

          <div class="opcoes-header-left">

            <i class="fas fa-list-check" style="color:var(--secondary-color)">
            </i>

            <span class="opcoes-titulo">
              Alternativas
            </span>

            <span class="opcoes-count" id="count-label">
              1 / 5
            </span>

          </div>

        </div>

        <!-- DICA -->
        <div class="correta-hint" id="correta-hint">

          <i class="fas fa-circle-info"></i>

          <span>
            Clique no <strong>círculo</strong> ou na
            <strong>letra</strong> da alternativa
            para marcá-la como <strong>correta</strong>
          </span>

        </div>

        <!-- STATUS -->
        <div class="correta-status" id="correta-status" style="display:none">

          <i class="fas fa-circle-check"></i>

          <span id="correta-status-texto">
            Alternativa A marcada como correta
          </span>

        </div>

        <!-- OPÇÕES -->
        <div id="opcoes-container"></div>

        <!-- BOTÃO ADICIONAR -->
        <button class="btn-add" id="btn-add-opcao" onclick="adicionarOpcao()">

          <i class="fas fa-plus"></i>
          Adicionar alternativa

        </button>

        <!-- NAVEGAÇÃO -->
        <div class="form-actions-question">

          <button class="btn btn-secondary" id="btn-anterior" onclick="questaoAnterior()" disabled>

            <i class="fas fa-arrow-left"></i>
            Anterior

          </button>

          <button class="btn btn-primary" id="btn-proxima" onclick="proximaQuestao()">

            <i class="fas fa-save"></i>
            Próxima Questão

          </button>

        </div>

      </div>

      <div class="divider"></div>



      <!-- BOTÕES -->
      <div class="main-actions">

        <button class="btn btn-secondary" onclick="cancelar()">

          <i class="fas fa-xmark"></i>
          Cancelar

        </button>

        <button class="btn btn-primary" onclick="publicarAtividade()">

          <i class="fas fa-paper-plane"></i>
          Publicar Atividade

        </button>

      </div>

    </div>

  </main>

  <!-- TOAST -->
  <div class="toast" id="toast">

    <i class="fas fa-circle-check" id="toast-icon">
    </i>

    <span id="toast-msg"></span>

  </div>

  <script src="../JS/atividadeCriar.js"></script>
  <script src="../../perfil/JS/menuSideBar.js"></script>

</body>

</html>
